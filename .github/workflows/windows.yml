# Windows: runs the server tests natively, installs Ervisio with install.ps1 on
# a real Windows runner, then checks that the service answers and that a local
# account can sign in. The binaries are kept as a workflow artifact.
# Manual only: Actions > Windows > Run workflow.
name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (go test, install, smoke test)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the build version
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Parse PowerShell scripts
        run: |
          foreach ($f in 'install-windows.ps1', 'packaging\windows\install.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { "${f}: $_" }; exit 1 }
            "$f parses"
          }

      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binaries
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          # Last tag plus a suffix (e.g. 0.5.0-12-gabc1234): plugins check it against
          # the core version they need, so a build without it looks like 0.1.0.
          $ver = (git describe --tags --always).TrimStart('v')
          $ld = "-X github.com/ervisio/ervisio/server/internal/brand.Version=$ver"
          "version: $ver"
          go build -trimpath -ldflags $ld -o bin/windows-amd64/ervisiod.exe ./cmd/ervisiod
          go build -trimpath -ldflags $ld -o bin/windows-amd64/ervisio-bridge.exe ./cmd/ervisio-bridge

      - name: Stage install folder
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item server\bin\windows-amd64\*.exe stage\
          Copy-Item -Recurse web\dist stage\web
          Copy-Item packaging\windows\install.ps1 stage\

      - uses: actions/upload-artifact@v4
        with:
          name: ervisio-windows-x64
          path: stage/

      - name: Install with install.ps1
        run: .\stage\install.ps1

      - name: Smoke test (health, sign-in, session, RPC)
        run: |
          $ErrorActionPreference = 'Stop'
          # Self-signed certificate: skip verification for this local check only.
          $skip = @{ SkipCertificateCheck = $true }
          $base = 'https://127.0.0.1:9090'
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $h = Invoke-RestMethod "$base/api/health" @skip; $ok = $true; break } catch { Start-Sleep 2 }
          }
          if (-not $ok) { throw 'ervisiod did not answer /api/health' }
          "health: $($h | ConvertTo-Json -Compress)"

          $pw = 'Ev-' + [guid]::NewGuid().ToString('N').Substring(0, 16) + '!a1'
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name ervtest -Password $sec -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Administrators -Member ervtest

          $hdr = @{ 'X-Requested-With' = 'ervisio' }
          $body = @{ user = 'ervtest'; password = $pw } | ConvertTo-Json
          $login = Invoke-RestMethod "$base/api/auth/login" -Method Post -Body $body -ContentType 'application/json' `
            -Headers $hdr -SessionVariable s @skip
          "login: $($login | ConvertTo-Json -Compress)"
          $sess = Invoke-RestMethod "$base/api/auth/session" -WebSession $s @skip
          if ($sess.os -ne 'windows') { throw "session.os is '$($sess.os)'" }

          # Each call is reported; the step fails at the end if any failed.
          $calls = @(
            @{ m = 'system.host'; p = @{} },
            @{ m = 'system.metrics'; p = @{} },
            @{ m = 'services.list'; p = @{ type = 'service' } },
            @{ m = 'services.summary'; p = @{} },
            @{ m = 'logs.sources'; p = @{} },
            @{ m = 'logs.query'; p = @{ sources = @('evt:System'); limit = 5 } },
            @{ m = 'files.places'; p = @{} },
            @{ m = 'files.list'; p = @{ path = 'C:\' } },
            @{ m = 'overview.processes'; p = @{} },
            @{ m = 'users.list'; p = @{} }
          )
          $failed = 0
          foreach ($c in $calls) {
            $rb = @{ method = $c.m; params = $c.p } | ConvertTo-Json -Depth 5
            try {
              $r = Invoke-RestMethod "$base/api/rpc" -Method Post -Body $rb -ContentType 'application/json' `
                -Headers $hdr -WebSession $s @skip
              $out = $r.result | ConvertTo-Json -Depth 3 -Compress
              if ($out.Length -gt 300) { $out = $out.Substring(0, 300) + '...' }
              "OK   $($c.m): $out"
            } catch {
              $failed++
              "FAIL $($c.m): $($_.ErrorDetails.Message)"
            }
          }
          if ($failed) { throw "$failed RPC call(s) failed" }

      - name: Service log
        if: always()
        run: |
          $log = Join-Path $env:ProgramData 'Ervisio\logs\ervisiod.log'
          if (Test-Path $log) { Get-Content $log -Tail 200 }

      - name: Uninstall
        if: always()
        run: |
          if (Test-Path stage\install.ps1) { .\stage\install.ps1 -Uninstall }
