name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (go vet, go test -race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install libpam headers (cgo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev
      - name: gofmt
        working-directory: server
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt'ed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        run: go test -race ./...
      - name: Build
        run: make build-server VERSION=ci-${GITHUB_SHA::7}

  web:
    name: Web (typecheck, lint, i18n, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  packaging:
    name: Packaging (shellcheck, install.sh dry run, nfpm)
    runs-on: ubuntu-24.04
    env:
      NFPM_VERSION: 2.47.0
      NFPM_SHA256_AMD64: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck -s sh install.sh packaging/install.sh packaging/package-service.sh packaging/pkg/scripts/*
          shellcheck packaging/build-release.sh packaging/build-packages.sh packaging/install-dev.sh packaging/arch/update-pkgbuild.sh
          shellcheck -s bash -e SC2034,SC2154,SC2164 packaging/arch/*/PKGBUILD packaging/arch/*/ervisio.install
      - name: AUR copies match packaging/
        run: |
          for d in packaging/arch/ervisio-bin packaging/arch/ervisio; do
            cmp packaging/pam.d/ervisio.arch "$d/ervisio.pam"
            cmp packaging/package-service.sh "$d/package-service.sh"
            cmp packaging/arch/ervisio-bin/ervisio.install "$d/ervisio.install"
          done
      - name: install.sh dry run with dash (downloads and verifies a real release)
        run: |
          # The releases before 0.3.0 are LinuxAdmin ones (other asset names):
          # until an Ervisio release exists, only the offline checks run.
          if curl -fsSL --proto '=https' https://github.com/ervisio/ervisio/releases/latest/download/SHA256SUMS | grep -q ' ervisio-'; then
            dash install.sh --dry-run | tee "$RUNNER_TEMP/dry.log"
            grep -q 'Signature of SHA256SUMS: good' "$RUNNER_TEMP/dry.log"
          else
            echo "::notice::No Ervisio release yet: install.sh dry run against a release skipped."
          fi
          dash install.sh --help >/dev/null
          dash install.sh --uninstall --dry-run --yes >/dev/null
      - name: Packages from a stub release folder
        run: |
          f="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$f" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "$NFPM_SHA256_AMD64  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" nfpm
          R="$RUNNER_TEMP/rel"
          mkdir -p "$R/bin" "$R/web" "$R/plugins"
          printf '#!/bin/sh\necho 0.0.0-ci\n' > "$R/bin/ervisiod"; cp "$R/bin/ervisiod" "$R/bin/ervisio-bridge"
          chmod 755 "$R/bin/"*
          echo '<!doctype html>' > "$R/web/index.html"
          echo 0.0.0-ci > "$R/VERSION"
          NFPM="$RUNNER_TEMP/nfpm" ./packaging/build-packages.sh "$R" amd64 "$RUNNER_TEMP/out"
          dpkg-deb --info "$RUNNER_TEMP/out/ervisio_0.0.0-ci_amd64.deb"
          dpkg-deb --info "$RUNNER_TEMP/out/ervisio_0.0.0-ci_amd64.deb" | grep -q '^ Replaces: linuxadmin$'
          dpkg-deb --contents "$RUNNER_TEMP/out/ervisio_0.0.0-ci_amd64.deb"
          dpkg-deb --contents "$RUNNER_TEMP/out/ervisio_0.0.0-ci_amd64.deb" | grep -q ' ./usr/lib/ervisio/managed$'
          test -s "$RUNNER_TEMP/out/ervisio-0.0.0-ci-1.x86_64.rpm"
