name: CI

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: 'Optional version for the downloadable Linux binaries (for example 0.6.5-ervisios.abcdef0)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (go vet, go test -race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install libpam headers (cgo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev
      - name: gofmt
        working-directory: server
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt'ed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go vet (windows)
        working-directory: server
        run: GOOS=windows go vet ./...
      - name: go test
        working-directory: server
        run: go test -race ./...
      - name: Build
        env:
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
        run: |
          version="${ARTIFACT_VERSION:-ci-${GITHUB_SHA::7}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ || "$version" =~ ^ci-[0-9a-f]{7,40}$ ]]; then
            echo 'artifact_version must be a semantic version or ci-<commit>' >&2
            exit 1
          fi
          make build-server VERSION="$version"
          (cd server && go build -trimpath -ldflags "-X github.com/ervisio/ervisio/server/internal/brand.Version=$version" -o bin/plugin-sign ./internal/modules/plugins/cmd/plugin-sign)
          test "$(server/bin/ervisiod --version)" = "$version"
          test "$(server/bin/ervisio-bridge --version)" = "$version"
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: ervisio-linux-amd64
          path: |
            server/bin/ervisiod
            server/bin/ervisio-bridge
            server/bin/plugin-sign
          if-no-files-found: error
          retention-days: 7
      - name: Build Windows binaries (amd64, arm64)
        run: make build-windows VERSION=ci-${GITHUB_SHA::7}

  backup-databases:
    name: Backup (real PostgreSQL and MariaDB fixtures)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backup
          POSTGRES_PASSWORD: backup-fixture-only
          POSTGRES_DB: ervisio_backup_fixture
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U backup -d ervisio_backup_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 24
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root-only
          MARIADB_USER: backup
          MARIADB_PASSWORD: backup-fixture-only
          MARIADB_DATABASE: ervisio_backup_fixture
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mariadb-admin ping --host=127.0.0.1 --user=root --password=fixture-root-only"
          --health-interval 5s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install database clients
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client mariadb-client
      - name: Grant fixture-only routine metadata access
        run: mariadb --host=127.0.0.1 --port=13306 --user=root --password=fixture-root-only -e "GRANT SELECT ON mysql.proc TO 'backup'@'%';"
      - name: Dump and verify disposable databases
        working-directory: server
        env:
          ERVISIO_BACKUP_TEST_DATABASES: '1'
          ERVISIO_BACKUP_TEST_POSTGRES_PORT: '15432'
          ERVISIO_BACKUP_TEST_MYSQL_PORT: '13306'
        run: go test -race ./internal/backup -count=1

  web:
    name: Web (typecheck, lint, i18n, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - name: Select browser for desktop interaction tests
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'PLAYWRIGHT_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            timeout 360s npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
      - run: npm run build

  packaging:
    name: Packaging (shellcheck, install.sh dry run, nfpm)
    runs-on: ubuntu-24.04
    env:
      NFPM_VERSION: 2.47.0
      NFPM_SHA256_AMD64: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck -s sh install.sh packaging/install.sh packaging/package-service.sh packaging/pkg/scripts/*
          shellcheck packaging/build-release.sh packaging/build-packages.sh packaging/install-dev.sh packaging/arch/update-pkgbuild.sh
          shellcheck -s bash -e SC2034,SC2154,SC2164 packaging/arch/*/PKGBUILD packaging/arch/*/ervisio.install
      - name: AUR copies match packaging/
        run: |
          for d in packaging/arch/ervisio-bin packaging/arch/ervisio; do
            cmp packaging/pam.d/ervisio.arch "$d/ervisio.pam"
            cmp packaging/package-service.sh "$d/package-service.sh"
            cmp packaging/arch/ervisio-bin/ervisio.install "$d/ervisio.install"
          done
      - name: install.sh dry run with dash (downloads and verifies a real release)
        run: |
          # The releases before 0.3.0 are LinuxAdmin ones (other asset names):
          # until an Ervisio release exists, only the offline checks run.
          if curl -fsSL --proto '=https' https://github.com/ervisio/ervisio/releases/latest/download/SHA256SUMS | grep -q ' ervisio-'; then
            dash install.sh --dry-run | tee "$RUNNER_TEMP/dry.log"
            grep -q 'Signature of SHA256SUMS: good' "$RUNNER_TEMP/dry.log"
          else
            echo "::notice::No Ervisio release yet: install.sh dry run against a release skipped."
          fi
          dash install.sh --help >/dev/null
          dash install.sh --uninstall --dry-run --yes >/dev/null
      - name: Packages from a stub release folder
        run: |
          f="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$f" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "$NFPM_SHA256_AMD64  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" nfpm
          R="$RUNNER_TEMP/rel"
          mkdir -p "$R/bin" "$R/web" "$R/plugins"
          printf '#!/bin/sh\necho 0.0.0-ci\n' > "$R/bin/ervisiod"; cp "$R/bin/ervisiod" "$R/bin/ervisio-bridge"
          chmod 755 "$R/bin/"*
          echo '<!doctype html>' > "$R/web/index.html"
          echo 0.0.0-ci > "$R/VERSION"
          NFPM="$RUNNER_TEMP/nfpm" ./packaging/build-packages.sh "$R" amd64 "$RUNNER_TEMP/out"
          dpkg-deb --info "$RUNNER_TEMP/out/ervisio_0.0.0-ci_amd64.deb"
          dpkg-deb --info "$RUNNER_TEMP/out/ervisio_0.0.0-ci_amd64.deb" | grep -q '^ Replaces: linuxadmin$'
          dpkg-deb --contents "$RUNNER_TEMP/out/ervisio_0.0.0-ci_amd64.deb"
          dpkg-deb --contents "$RUNNER_TEMP/out/ervisio_0.0.0-ci_amd64.deb" | grep -q ' ./usr/lib/ervisio/managed$'
          test -s "$RUNNER_TEMP/out/ervisio-0.0.0-ci-1.x86_64.rpm"
