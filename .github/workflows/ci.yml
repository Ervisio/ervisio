name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (go vet, go test -race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install libpam headers (cgo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev
      - name: gofmt
        working-directory: server
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt'ed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test
        working-directory: server
        run: go test -race ./...
      - name: Build
        run: make build-server VERSION=ci-${GITHUB_SHA::7}

  web:
    name: Web (typecheck, lint, i18n, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
