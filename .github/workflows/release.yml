# Builds, signs and publishes a release when a version tag is pushed:
#
#   git tag -a v1.2.0 -m "Ervisio 1.2.0" && git push origin v1.2.0
#
# vX.Y.Z      -> stable release ("latest"): offered to every machine on the stable channel
# vX.Y.Z-rc.1 -> pre-release: offered only to machines on the prerelease channel
#
# Assets: ervisio-<version>-linux-{amd64,arm64}.tar.gz, ervisio-<version>-windows-{amd64,arm64}.zip, the packages
# ervisio_<version>_{amd64,arm64}.deb and ervisio-<version>-1.{x86_64,aarch64}.rpm
# (nfpm), the compatibility archives linuxadmin-<version>-linux-{amd64,arm64}.tar.gz
# that consoles still running LinuxAdmin (Ervisio's name up to 0.2.0) update
# from (docs/RELEASING.md, "Rename transition"), SHA256SUMS over all of them
# and SHA256SUMS.sig (ed25519, secret RELEASE_SIGNING_KEY). Installed consoles and install.sh refuse anything
# that does not verify against the release key embedded in
# server/internal/update/sign.go. See docs/RELEASING.md and docs/PACKAGING.md.
#
# Optional: with the AUR_SSH_KEY secret set, stable releases are also pushed
# to the AUR packages ervisio-bin and ervisio (job "aur"; off while the
# secret does not exist).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # nfpm builds the .deb and .rpm; pinned, checked against its release checksums.txt.
  NFPM_VERSION: 2.47.0
  NFPM_SHA256_AMD64: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
  NFPM_SHA256_ARM64: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vX.Y.Z or vX.Y.Z-pre"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  web:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run i18n:check
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [meta, web]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install libpam headers (cgo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Test
        working-directory: server
        run: go vet ./... && go test ./...
      - name: Build binaries against glibc 2.17 (brand.Version = ${{ env.VERSION }})
        run: |
          # In a manylinux2014 container, so the binaries also run on old distributions.
          GO_VERSION="$(go env GOVERSION | sed 's/^go//')" ./packaging/build-compat.sh "$VERSION" "${{ matrix.arch }}"
          test "$(server/bin/ervisiod --version)" = "$VERSION"
          test "$(server/bin/ervisio-bridge --version)" = "$VERSION"
      - name: Package
        run: ./packaging/build-release.sh "$VERSION" "${{ matrix.arch }}" dist
      - name: Install nfpm ${{ env.NFPM_VERSION }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            amd64) f="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"; sum="$NFPM_SHA256_AMD64" ;;
            arm64) f="nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz"; sum="$NFPM_SHA256_ARM64" ;;
          esac
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$f" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$f"
          echo "$sum  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" nfpm
          "$RUNNER_TEMP/nfpm" --version | tail -n 3
      - name: Packages (.deb, .rpm)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Built from the release archive itself, so archive and packages hold the same files.
          mkdir -p "$RUNNER_TEMP/rel"
          tar -xzf "dist/ervisio-$VERSION-linux-$ARCH.tar.gz" -C "$RUNNER_TEMP/rel"
          NFPM="$RUNNER_TEMP/nfpm" ./packaging/build-packages.sh "$RUNNER_TEMP/rel/ervisio-$VERSION-linux-$ARCH" "$ARCH" dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: [meta, web]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build Windows archives (brand.Version = ${{ env.VERSION }})
        run: |
          make build-windows VERSION="$VERSION"
          mkdir -p dist
          for arch in amd64 arm64; do
            d="$RUNNER_TEMP/ervisio-$VERSION-windows-$arch"
            mkdir -p "$d"
            cp server/bin/windows-$arch/*.exe packaging/windows/install.ps1 "$d/"
            cp -r web/dist "$d/web"
            (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/ervisio-$VERSION-windows-$arch.zip" "ervisio-$VERSION-windows-$arch")
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [meta, build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums and signature
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is not set (docs/RELEASING.md)"; exit 1
          fi
          (cd server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/release-sign" ./tools/release-sign)
          umask 077
          KEY="$RUNNER_TEMP/release.key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY"
          cd dist
          assets=("ervisio-$VERSION-linux-amd64.tar.gz" "ervisio-$VERSION-linux-arm64.tar.gz"
                  "ervisio_${VERSION}_amd64.deb" "ervisio_${VERSION}_arm64.deb"
                  "ervisio-$VERSION-1.x86_64.rpm" "ervisio-$VERSION-1.aarch64.rpm"
                  "linuxadmin-$VERSION-linux-amd64.tar.gz" "linuxadmin-$VERSION-linux-arm64.tar.gz"
                  "ervisio-$VERSION-windows-amd64.zip" "ervisio-$VERSION-windows-arm64.zip")
          ls -l "${assets[@]}"
          # Every asset is listed, so the packages are covered by the signature too.
          sha256sum "${assets[@]}" > SHA256SUMS
          "$RUNNER_TEMP/release-sign" -key "$KEY" SHA256SUMS
          rm -f "$KEY"
          # Against the key embedded in the code: fails if the secret is not
          # the release key the consoles trust.
          "$RUNNER_TEMP/release-sign" -verify -dir . SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          # 1. The CHANGELOG.md section "## [X.Y.Z]" or "## X.Y.Z" (until the next "## ").
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / { if (p) exit; h=$0; sub(/^## +\[?v?/, "", h); gsub(/\]/, " ", h); split(h, a, /[ \t(]+/); if (a[1] == v) { p=1; next } }
              p { print }' CHANGELOG.md > "$notes"
          fi
          # 2. Otherwise the message of the annotated tag.
          if ! grep -q '[^[:space:]]' "$notes" && [ "$(git cat-file -t "$TAG")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "Ervisio $VERSION." > "$notes"
          fi
          cat >> "$notes" <<'EOF'

          ---
          Install: `curl -fsSL https://raw.githubusercontent.com/ervisio/ervisio/main/install.sh | sudo sh` (or download `install.sh`, read it, then `sudo sh install.sh`).
          Windows (10 1809+ / Server 2019+), in an elevated PowerShell: `irm https://raw.githubusercontent.com/ervisio/ervisio/main/install-windows.ps1 | iex`.
          Packages: the `.deb` (Debian 12+, Ubuntu 22.04+) and `.rpm` (Fedora, RHEL 9+, openSUSE) below; a packaged install is updated by its package manager.
          Consoles installed with `install.sh` update from **Settings › About › Check for updates**.
          Ervisio was called LinuxAdmin: LinuxAdmin consoles update to Ervisio the same way (they use the `linuxadmin-*.tar.gz` archives), and `install.sh` or the packages move an existing LinuxAdmin with its settings.
          `SHA256SUMS` lists every file of the release and is signed with the release key (`SHA256SUMS.sig`, ed25519); consoles and `install.sh` verify it before installing.
          EOF
          cat "$notes"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --title "Ervisio $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" \
            dist/ervisio-"$VERSION"-linux-*.tar.gz dist/ervisio_"$VERSION"_*.deb dist/ervisio-"$VERSION"-1.*.rpm \
            dist/linuxadmin-"$VERSION"-linux-*.tar.gz dist/ervisio-"$VERSION"-windows-*.zip \
            dist/SHA256SUMS dist/SHA256SUMS.sig

  # AUR: off unless the AUR_SSH_KEY secret exists (docs/PACKAGING.md). Stable
  # releases only. Pushes PKGBUILD/.SRCINFO for ervisio-bin and ervisio,
  # regenerated by packaging/arch/update-pkgbuild.sh for this version. The
  # copies in this repository are not changed: commit them by hand.
  aur-enabled:
    needs: [meta, release]
    if: needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - id: c
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then echo "enabled=true"; else echo "enabled=false"; echo "AUR_SSH_KEY is not set: AUR publishing skipped." >&2; fi >> "$GITHUB_OUTPUT"

  aur:
    needs: [meta, aur-enabled]
    if: needs.aur-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git openssh go
      - uses: actions/checkout@v4
      - name: Update the PKGBUILDs (verifies the release signature)
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && ./packaging/arch/update-pkgbuild.sh '$VERSION'"
      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git config --global user.name "Fonlogen"
          git config --global user.email "info.fonlogen@gmail.com"
          for pkg in ervisio-bin ervisio; do
            rm -rf "/tmp/aur-$pkg"
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "/tmp/aur-$pkg"
            cp packaging/arch/$pkg/{PKGBUILD,.SRCINFO,ervisio.install,ervisio.pam,package-service.sh} "/tmp/aur-$pkg/"
            cd "/tmp/aur-$pkg"
            git add PKGBUILD .SRCINFO ervisio.install ervisio.pam package-service.sh
            if git diff --cached --quiet; then echo "$pkg: no change"; else git commit -q -m "Update to $VERSION" && git push origin HEAD:master; fi
            cd "$GITHUB_WORKSPACE"
          done
          rm -f ~/.ssh/aur
      - uses: actions/upload-artifact@v4
        with:
          name: aur-${{ needs.meta.outputs.version }}
          path: packaging/arch
          retention-days: 30
