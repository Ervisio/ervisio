# nfpm (https://nfpm.goreleaser.com) configuration for the .deb and .rpm
# packages. Do not run nfpm on it directly: packaging/build-packages.sh
# stages a release folder and this file together and runs nfpm there, so
# every src below is relative to that staging folder.
#
# Packages use the flat layout and mark the install as managed:
#   /usr/bin/ervisiod                  daemon
#   /usr/lib/ervisio/ervisio-bridge    bridge
#   /usr/share/ervisio/web             web app
#   /usr/share/ervisio/plugins         packaged plugins (empty: plugins come from the marketplace)
#   /usr/lib/ervisio/managed           "apt" / "dnf" / "zypper": self-update is off
#
# Ervisio was called LinuxAdmin up to 0.2.0: the package replaces the
# linuxadmin package (deb: Replaces/Conflicts/Provides, rpm: Obsoletes/
# Provides), and the install scripts copy its configuration and data
# (ervisiod --migrate-legacy, docs/RELEASING.md "Rename transition").
name: ervisio
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: admin
priority: optional
maintainer: Fonlogen <info.fonlogen@gmail.com>
vendor: Fonlogen
homepage: https://github.com/ervisio/ervisio
license: MIT
description: |-
  Web console for managing a Linux server from the browser
  Sign in with a Linux account (PAM) and get an overview, a terminal, a file
  manager, logs, systemd services, software updates, user management and
  plugins. Administrator rights use sudo. The console listens on port 9090
  (HTTPS, self-signed certificate on first start).

contents:
  - src: ./bin/ervisiod
    dst: /usr/bin/ervisiod
    file_info:
      mode: 0755
  - src: ./bin/ervisio-bridge
    dst: /usr/lib/ervisio/ervisio-bridge
    file_info:
      mode: 0755
  - src: ./package-service.sh
    dst: /usr/lib/ervisio/package-service
    file_info:
      mode: 0755
  - src: ./web
    dst: /usr/share/ervisio/web
    type: tree
  - dst: /usr/share/ervisio/plugins
    type: dir
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/licenses/ervisio/LICENSE
    file_info:
      mode: 0644
  - src: ./ervisio.service
    dst: /usr/lib/systemd/system/ervisio.service
    file_info:
      mode: 0644
  - dst: /usr/lib/ervisio
    type: dir
    file_info:
      mode: 0755
  - dst: /usr/share/ervisio
    type: dir
    file_info:
      mode: 0755
  - dst: /etc/ervisio
    type: dir
    file_info:
      mode: 0755
  - dst: /var/lib/ervisio
    type: dir
    file_info:
      mode: 0755

  # Debian / Ubuntu: one PAM file, a conffile.
  - src: ./pam.d/ervisio.debian
    dst: /etc/pam.d/ervisio
    type: config|noreplace
    packager: deb
    file_info:
      mode: 0644
  - src: ./managed.apt
    dst: /usr/lib/ervisio/managed
    packager: deb
    file_info:
      mode: 0644

  # One .rpm for Fedora/RHEL and openSUSE: the post-install script writes
  # /etc/pam.d/ervisio for the family it runs on, and the marker with the
  # package manager there (dnf or zypper).
  - src: ./pam.d/ervisio.fedora
    dst: /usr/share/ervisio/pam.d/ervisio.fedora
    packager: rpm
    file_info:
      mode: 0644
  - src: ./pam.d/ervisio.suse
    dst: /usr/share/ervisio/pam.d/ervisio.suse
    packager: rpm
    file_info:
      mode: 0644
  - dst: /etc/pam.d/ervisio
    type: ghost
    packager: rpm
  - dst: /usr/lib/ervisio/managed
    type: ghost
    packager: rpm

overrides:
  deb:
    replaces:
      - linuxadmin
    conflicts:
      - linuxadmin
    provides:
      - linuxadmin
    depends:
      - sudo
      - libpam0g
      - libpam-runtime
      - systemd
    scripts:
      postinstall: ./scripts/deb-postinst
      preremove: ./scripts/deb-prerm
      postremove: ./scripts/deb-postrm
  rpm:
    # nfpm writes "replaces" as Obsoletes for rpm.
    replaces:
      - linuxadmin < ${VERSION}
    provides:
      - linuxadmin = ${VERSION}
    depends:
      - sudo
      - pam
      - systemd
    scripts:
      postinstall: ./scripts/rpm-post
      preremove: ./scripts/rpm-preun
      postremove: ./scripts/rpm-postun

deb:
  fields:
    Bugs: https://github.com/ervisio/ervisio/issues
rpm:
  group: System Environment/Daemons
  summary: Web console for managing a Linux server from the browser
